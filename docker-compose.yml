services:
  lucos_scheduled_scripts:
    build: base-image
    image: lucas42/lucos_scheduled_scripts:${VERSION:-latest}
    container_name: lucos_scheduled_scripts
  test:
    build: test
    image: lucas42/lucos_scheduled_scripts_test
    container_name: lucos_scheduled_scripts_test
    environment:
      - SYSTEM=lucos_scheduled_scripts_test
      - LOGANNE_ENDPOINT=http://loganne.test/events
      - SCHEDULE_TRACKER_ENDPOINT=http://schedule-tracker.test/
    command: python /root/test-interface.py
    profiles:
      - test